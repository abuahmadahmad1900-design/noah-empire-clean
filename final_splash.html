<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦅 إمبراطورية نوح العظمى العالمية</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#000008; }
        body {
            font-family:'Tahoma',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            position:relative;
        }
        .bg {
            position:fixed; inset:0; z-index:0;
            background:
                radial-gradient(ellipse at 50% 50%, rgba(255,215,0,0.12), transparent 55%),
                radial-gradient(ellipse at 20% 30%, rgba(0,200,255,0.07), transparent 45%),
                radial-gradient(ellipse at 80% 70%, rgba(255,100,0,0.07), transparent 45%),
                radial-gradient(ellipse at 30% 80%, rgba(255,0,150,0.04), transparent 40%);
            animation: bgPulse 5s ease infinite;
        }
        @keyframes bgPulse { 0%,100%{opacity:.7} 50%{opacity:1} }
        
        .stars { position:fixed; inset:0; z-index:1; pointer-events:none; }
        .star {
            position:absolute; background:#fff; border-radius:50%;
            animation:twinkle 2.5s infinite;
        }
        @keyframes twinkle {
            0%,100%{opacity:.15; transform:scale(1)}
            50%{opacity:1; transform:scale(2)}
        }
        
        .scene { position:relative; z-index:2; text-align:center; }
        
        /* هالة */
        .halo {
            position:absolute; top:50%; left:50%;
            border-radius:50%; pointer-events:none;
            transform:translate(-50%,-50%);
        }
        .halo1 {
            width:280px; height:280px;
            background:radial-gradient(circle, rgba(255,215,0,0.35), transparent 70%);
            animation:haloPulse 3s ease infinite;
        }
        .halo2 {
            width:400px; height:400px;
            background:radial-gradient(circle, rgba(255,215,0,0.15), transparent 70%);
            animation:haloPulse 4s ease infinite reverse;
        }
        @keyframes haloPulse {
            0%,100%{transform:translate(-50%,-50%) scale(.8); opacity:.5}
            50%{transform:translate(-50%,-50%) scale(1.3); opacity:1}
        }
        
        /* النسر */
        .eagle {
            font-size:9rem;
            opacity:0;
            animation:eagleArrive 3.5s cubic-bezier(.175,.885,.32,1.275) forwards;
            filter:drop-shadow(0 0 140px rgba(255,215,0,1)) drop-shadow(0 0 50px rgba(255,100,0,.7));
            position:relative; z-index:3;
        }
        @keyframes eagleArrive {
            0%{opacity:0; transform:scale(0) rotate(-1080deg) translateY(-400px)}
            30%{opacity:.5; transform:scale(.4) rotate(-720deg) translateY(-150px)}
            60%{opacity:1; transform:scale(1.25) rotate(-180deg) translateY(0)}
            80%{opacity:1; transform:scale(.9) rotate(-30deg)}
            100%{opacity:1; transform:scale(1) rotate(0)}
        }
        
        /* مدارات */
        .orbit {
            position:absolute; top:50%; left:50%;
            border-radius:50%; pointer-events:none;
        }
        .orbit1 {
            width:250px; height:250px; margin:-125px 0 0 -125px;
            border:2px dashed rgba(255,215,0,.5);
            animation:orbitSpin 4s linear infinite;
        }
        .orbit2 {
            width:340px; height:340px; margin:-170px 0 0 -170px;
            border:2px dotted rgba(255,215,0,.3);
            animation:orbitSpin 7s linear infinite reverse;
        }
        .orbit3 {
            width:430px; height:430px; margin:-215px 0 0 -215px;
            border:1px solid rgba(0,200,255,.2);
            animation:orbitSpin 10s linear infinite;
        }
        @keyframes orbitSpin { to { transform:rotate(360deg) } }
        
        .orbDot {
            position:absolute; width:16px; height:16px;
            background:#FFD700; border-radius:50%;
            box-shadow:0 0 40px #FFD700;
        }
        
        /* شعارات المنصات */
        .logos { position:fixed; inset:0; z-index:4; pointer-events:none; }
        .plogo {
            position:absolute; font-size:3.5rem; opacity:0;
            filter:drop-shadow(0 0 40px rgba(255,215,0,.9));
            animation:logoFly 6s ease forwards;
        }
        @keyframes logoFly {
            0%{opacity:0; transform:translate(0,0) scale(0) rotate(0)}
            10%{opacity:1; transform:translate(0,0) scale(1.6) rotate(180deg)}
            50%{opacity:1; transform:translate(var(--mx),var(--my)) scale(1) rotate(360deg)}
            80%{opacity:1; transform:translate(calc(var(--mx)*.6),calc(var(--my)*.6)) scale(.7) rotate(540deg)}
            100%{opacity:0; transform:translate(0,0) scale(0) rotate(720deg)}
        }
        
        /* وميض */
        .sparkle {
            position:absolute; width:10px; height:10px;
            background:#fff; border-radius:50%;
            box-shadow:0 0 40px #FFD700;
            animation:sparkle 2s infinite;
        }
        @keyframes sparkle {
            0%,100%{opacity:0; transform:scale(0)}
            50%{opacity:1; transform:scale(2.5)}
        }
        
        /* العنوان */
        .title {
            font-size:5rem; font-weight:900; margin-top:90px;
            opacity:0;
            background:linear-gradient(45deg,#FFD700,#FFAA00,#FF5500,#FFD700,#FFAA00);
            background-size:400% 400%;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            animation:titleShow 3s ease 2s forwards, titleShine 3s ease 5s infinite;
            letter-spacing:15px;
            filter:drop-shadow(0 0 120px rgba(255,215,0,1));
        }
        @keyframes titleShow {
            0%{opacity:0; transform:translateY(180px) scale(.1); filter:blur(40px)}
            60%{opacity:1; transform:translateY(-40px) scale(1.1); filter:blur(0)}
            100%{opacity:1; transform:translateY(0) scale(1)}
        }
        @keyframes titleShine {
            0%,100%{background-position:0% 50%; filter:drop-shadow(0 0 100px rgba(255,215,0,.8))}
            50%{background-position:100% 50%; filter:drop-shadow(0 0 160px rgba(255,215,0,1.3))}
        }
        
        .subtitle {
            font-size:1.8rem; color:#ddd; margin-top:25px;
            opacity:0;
            animation:titleShow 2.5s ease 2.8s forwards;
            letter-spacing:10px;
        }
        
        .fadeWhite {
            position:fixed; inset:0; z-index:10; background:#fff;
            opacity:0; pointer-events:none;
            animation:whiteOut 2s ease 5.5s forwards;
        }
        @keyframes whiteOut {
            0%{opacity:0} 40%{opacity:1} 100%{opacity:0}
        }
        
        .redirectMsg {
            position:fixed; bottom:25px; left:50%; transform:translateX(-50%);
            z-index:9; color:#FFD700; opacity:0;
            animation:msgShow 1s ease 4.5s forwards;
            letter-spacing:2px; font-size:1rem;
        }
        @keyframes msgShow { to{opacity:1} }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="stars" id="stars"></div>
    <div class="logos" id="logos"></div>
    
    <div class="scene">
        <div class="halo halo1"></div>
        <div class="halo halo2"></div>
        
        <div class="orbit orbit1"><div class="orbDot" style="top:0; left:50%;"></div></div>
        <div class="orbit orbit2"><div class="orbDot" style="bottom:8%; right:12%;"></div></div>
        <div class="orbit orbit3"><div class="orbDot" style="top:15%; left:8%; background:#00c8ff; box-shadow:0 0 40px #00c8ff;"></div></div>
        
        <div class="eagle">🦅</div>
        
        <div class="sparkle" style="top:18%; left:25%;"></div>
        <div class="sparkle" style="top:55%; left:75%; animation-delay:.5s;"></div>
        <div class="sparkle" style="top:35%; left:10%; animation-delay:1s;"></div>
        <div class="sparkle" style="top:65%; left:35%; animation-delay:1.5s;"></div>
        <div class="sparkle" style="top:25%; left:60%; animation-delay:1.2s;"></div>
        
        <div class="title">إمبراطورية نوح</div>
        <div class="subtitle">العظمى العالمية</div>
    </div>
    
    <div class="fadeWhite"></div>
    <div class="redirectMsg">✨ الدخول إلى الإمبراطورية...</div>
    
    <script>
        // 300 نجمة
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 300; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (Math.random() * 4 + 1) + 'px';
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }
        
        // شعارات المنصات
        const logosContainer = document.getElementById('logos');
        const logos = [
            {icon:'🧠'},{icon:'💰'},{icon:'🏥'},{icon:'📊'},{icon:'🛒'},{icon:'🤖'}
        ];
        logos.forEach((logo, index) => {
            const span = document.createElement('span');
            span.className = 'plogo';
            span.textContent = logo.icon;
            span.style.left = (8 + Math.random() * 84) + '%';
            span.style.top = (8 + Math.random() * 84) + '%';
            const angle = Math.random() * 360;
            const dist = 150 + Math.random() * 350;
            span.style.setProperty('--mx', Math.cos(angle) * dist + 'px');
            span.style.setProperty('--my', Math.sin(angle) * dist + 'px');
            span.style.animationDelay = (0.5 + index * 0.4) + 's';
            logosContainer.appendChild(span);
        });
        
        setTimeout(() => {
            window.location.href = 'empire_magic_entrance.html';
        }, 7000);
    </script>
</body>
</html>
